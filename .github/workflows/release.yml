name: Release plugin

# When plugin/package.json's version is new, publish release vX.Y.Z with the plugin.
# Zotero checks the latest release's updates.json and updates itself.
on:
  push:
    branches: [main]
    paths: ["plugin/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          v="v$(jq -r .version plugin/package.json)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - if: steps.version.outputs.exists == 'false'
        working-directory: plugin
        run: npm ci && npm run build
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.tag }}
      - if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            plugin/build/rmzotero.xpi
            plugin/build/updates.json
