name: Release plugin

# Push a tag like v0.2.0 to publish a release with the plugin; Zotero picks up updates from it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - working-directory: plugin
        run: npm ci && npm run build
        env:
          PLUGIN_VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            plugin/build/rmzotero.xpi
            plugin/build/updates.json
