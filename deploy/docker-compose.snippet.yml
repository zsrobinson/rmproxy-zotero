# Add this service to the docker-compose.yml that already runs rmfakecloud.
# It assumes rmfakecloud's service is called "rmfakecloud" and listens on 3000 inside the network.
# Update later with: docker compose pull rmzotero && docker compose up -d rmzotero
services:
  rmzotero:
    image: ghcr.io/zsrobinson/rmproxy-zotero:latest
    restart: unless-stopped
    depends_on:
      - rmfakecloud
    volumes:
      - ./rmzotero/config:/config:ro     # holds rmzotero.toml
      - ./rmzotero/data:/data            # state, the exact-page archive, device token
    ports:
      - "8787:8787"                      # the plugin API; put it behind your tunnel/reverse proxy with HTTPS
    # environment:
    #   PUID: "1026"                      # run as this user/group; default: the owner of ./rmzotero/data
    #   PGID: "100"
    #   RMZOTERO_OCR_LANGUAGE: "eng+deu"  # tesseract languages (only English is in the image)
