[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmzotero"
version = "0.1.0"
description = "Two-way sync between a Zotero library and a reMarkable tablet via rmfakecloud"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
  "rmscene>=0.7",
  "pikepdf>=8",
  "pypdfium2>=4",
  "typst>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rmzotero = "rmzotero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
